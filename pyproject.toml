[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-bakeoff"
version = "0.1.0"
description = "Deterministic bake-off harness for agent memory engines"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scikit-learn>=1.4", "pandas>=2.0", "requests>=2.31"]

[project.optional-dependencies]
test = ["pytest>=8"]
plots = ["matplotlib>=3.8"]

[project.scripts]
memory-bakeoff = "memory_bakeoff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# vendor/membukkit is the repo's OWN copy of the engine under test, pinned to
# commit f28a2e58 with blob SHAs verified against upstream (see
# vendor/membukkit/UPSTREAM.md). Putting it on the path makes that verified copy
# importable; it does NOT substitute the engine. `pip install membukkit` would
# have pulled an unpinned PyPI build - a substitution, in a module whose whole
# job is raising FallbackDetected when a substitute stands in for the intended
# artifact. That distinction is why this is configuration, not a scientific
# choice.
pythonpath = ["src", "vendor/membukkit/src"]
testpaths = ["tests"]
