# Tern-owned post-intake triage. Existing wake transport; rc3 means queued.
[Service]
ExecStartPost=/bin/sh -c 'AGENTDECK_PROFILE=campaign4 /home/bmosher/.config/agent-deck/wake tern "Research intake finished. Tern owns tier4 triage of new or changed team/INTEL reports within 2h. Read campaign4/INTAKE-TRIAGE-POLICY.md; commit raw reports and hash-bound dispositions. No research execution implied."; rc=$?; if [ "$rc" -eq 3 ]; then exit 0; else exit "$rc"; fi'
